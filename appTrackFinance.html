<style>
:root{--bg:#0a0f0d;--bg-card:#111a16;--bg-card-alt:#162019;--fg:#e8f0ec;--fg-muted:#7a9488;--accent:#00e68a;--accent-dim:#00b36b;--accent-glow:rgba(0,230,138,0.15);--income:#5cb8ff;--income-dim:#3a9cdf;--income-glow:rgba(92,184,255,0.15);--danger:#ff5c5c;--danger-dim:rgba(255,92,92,0.15);--warning:#ffb347;--warning-dim:rgba(255,179,71,0.15);--border:#1e2e27;--border-light:#2a3d33}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif}
.bg-atmo{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 600px 400px at 10% 20%,rgba(0,230,138,0.06),transparent),radial-gradient(ellipse 500px 500px at 85% 70%,rgba(92,184,255,0.04),transparent)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-15px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 15px var(--accent-glow)}50%{box-shadow:0 0 30px var(--accent-glow),0 0 60px rgba(0,230,138,0.05)}}
@keyframes progressFill{from{width:0}}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(0.9)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes bellShake{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-8deg)}45%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}75%{transform:rotate(2deg)}}
.anim-fade-up{animation:fadeUp .5s ease both}.anim-slide-in{animation:slideIn .4s ease both}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;transition:border-color .3s,box-shadow .3s}
.card:hover{border-color:var(--border-light);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.btn-p{background:var(--accent);color:var(--bg);font-weight:600;border-radius:12px;padding:10px 20px;border:none;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;font-size:14px}
.btn-p:hover{background:var(--accent-dim);transform:translateY(-1px);box-shadow:0 4px 20px var(--accent-glow)}
.btn-i{background:var(--income);color:var(--bg);font-weight:600;border-radius:12px;padding:10px 20px;border:none;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;font-size:14px}
.btn-i:hover{background:var(--income-dim);transform:translateY(-1px);box-shadow:0 4px 20px var(--income-glow)}
.btn-s{background:transparent;color:var(--fg);font-weight:500;border-radius:12px;padding:10px 20px;border:1px solid var(--border-light);cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;font-size:14px}

.nav-i{padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;color:var(--fg-muted);font-weight:500;display:flex;align-items:center;gap:10px;font-size:14px}

.prog-t{background:var(--border);border-radius:8px;height:10px;overflow:hidden}
.prog-f{height:100%;border-radius:8px;animation:progressFill .8s ease both;transition:width .5s ease}
.toast-c{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;animation:toastIn .3s ease both;display:flex;align-items:center;gap:8px;min-width:250px;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
.toast.out{animation:toastOut .3s ease both}
.toast.ok{background:#0d2b1a;color:var(--accent);border:1px solid rgba(0,230,138,0.2)}
.toast.err{background:#2b0d0d;color:var(--danger);border:1px solid rgba(255,92,92,0.2)}
.toast.inf{background:#0d1f2b;color:#5cb8ff;border:1px solid rgba(92,184,255,0.2)}
.toast.wrn{background:#2b1f0d;color:var(--warning);border:1px solid rgba(255,179,71,0.2)}
.mo{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;animation:fadeUp .25s ease both}
.mo-b{background:var(--bg-card);border:1px solid var(--border-light);border-radius:20px;padding:28px;max-width:520px;width:90%;animation:fadeUp .3s ease both;max-height:85vh;overflow-y:auto}

.sc::before{content:'';position:absolute;inset:0;border-radius:16px;background:linear-gradient(90deg,transparent 30%,rgba(0,230,138,0.03) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 4s ease infinite;pointer-events:none}
.bell-shake{animation:bellShake .8s ease}
/* Bouton install PWA */
.install-btn{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:900;background:var(--accent);color:var(--bg);font-weight:700;border-radius:16px;padding:14px 28px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:15px;box-shadow:0 8px 30px rgba(0,230,138,0.3);display:none;animation:fadeUp .4s ease both;transition:transform .2s,box-shadow .2s}
.install-btn:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 12px 40px rgba(0,230,138,0.4)}

@media(min-width:769px){.mn{display:none!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div style="display:flex;min-height:100vh;position:relative;z-index:1;">

    <div id="alert-bell" onclick="toggleAlertPanel()" style="position:relative;cursor:pointer;padding:8px;border-radius:10px;transition:all .2s;" onmouseover="this.style.background='var(--bg-card-alt)'" onmouseout="this.style.background='transparent'"><i class="fas fa-bell" style="color:var(--fg-muted);font-size:16px;"></i><div id="alert-badge" style="display:none;position:absolute;top:4px;right:4px;min-width:16px;height:16px;background:var(--danger);border-radius:8px;font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg-card);"></div></div>
  </div>
  <div id="alert-panel" style="display:none;margin-bottom:16px;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:12px;max-height:240px;overflow-y:auto;"></div>

    <div onclick="switchPage('dashboard')" style="text-align:center;cursor:pointer;padding:4px;"><i class="fas fa-th-large" style="color:var(--accent);font-size:16px;"></i><div style="font-size:9px;color:var(--fg-muted);margin-top:2px;">Accueil</div></div>

    <div onclick="switchPage('accounts')" style="text-align:center;cursor:pointer;padding:4px;"><i class="fas fa-wallet" style="color:var(--fg-muted);font-size:16px;"></i><div style="font-size:9px;color:var(--fg-muted);margin-top:2px;">Comptes</div></div>
  </nav>

<script>
// ═══════════════════════════════════════════
// PWA : Manifest + Service Worker + Install
// ═══════════════════════════════════════════
(function(){
  // Manifest inline via Blob URL
  const manifest = {
    name: 'FinTrack — Suivi de Dépenses',
    short_name: 'FinTrack',
    description: 'Suivi de dépenses, revenus, objectifs et budgets',
    start_url: './',
    display: 'standalone',
    background_color: '#0a0f0d',
    theme_color: '#0a0f0d',
    orientation: 'portrait-primary',
    icons: [{
      src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="100" fill="%230a0f0d"/><path d="M150 340 L256 180 L362 340" stroke="%2300e68a" stroke-width="40" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="256" cy="180" r="24" fill="%2300e68a"/></svg>'),
      sizes: '512x512',
      type: 'image/svg+xml',
      purpose: 'any maskable'
    }]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
  const manifestLink = document.getElementById('pwa-manifest');
  if (manifestLink) manifestLink.href = URL.createObjectURL(blob);

  // Enregistrement du Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  // Prompt d'installation natif
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    const btn = document.getElementById('install-btn');
    if (btn) btn.style.display = 'block';
  });

  window.installPWA = function() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(choice => {
      if (choice.outcome === 'accepted') toast('FinTrack installée !');
      deferredPrompt = null;
      const btn = document.getElementById('install-btn');
      if (btn) btn.style.display = 'none';
    });
  };

  window.addEventListener('appinstalled', () => {
    toast('Application installée avec succès');
    const btn = document.getElementById('install-btn');
    if (btn) btn.style.display = 'none';
  });
})();
</script>

<script>
// ═══════════════════════════════════
// CATÉGORIES
// ═══════════════════════════════════
const EXP_CATS=[
  {id:'food',name:'Alimentation',icon:'fa-utensils',color:'#00e68a',bg:'rgba(0,230,138,0.12)'},
  {id:'transport',name:'Transport',icon:'fa-car',color:'#5cb8ff',bg:'rgba(92,184,255,0.12)'},
  {id:'housing',name:'Logement',icon:'fa-home',color:'#ffb347',bg:'rgba(255,179,71,0.12)'},
  {id:'health',name:'Santé',icon:'fa-heartbeat',color:'#ff5c5c',bg:'rgba(255,92,92,0.12)'},
  {id:'leisure',name:'Loisirs',icon:'fa-gamepad',color:'#c084fc',bg:'rgba(192,132,252,0.12)'},
  {id:'shopping',name:'Shopping',icon:'fa-shopping-bag',color:'#fb7185',bg:'rgba(251,113,133,0.12)'},
  {id:'education',name:'Éducation',icon:'fa-book',color:'#38bdf8',bg:'rgba(56,189,248,0.12)'},
  {id:'other_exp',name:'Autre dépense',icon:'fa-ellipsis-h',color:'#94a3b8',bg:'rgba(148,163,184,0.12)'}
];
const INC_CATS=[
  {id:'salary',name:'Salaire',icon:'fa-briefcase',color:'#5cb8ff',bg:'rgba(92,184,255,0.12)'},
  {id:'freelance',name:'Freelance / Livraison',icon:'fa-motorcycle',color:'#00e68a',bg:'rgba(0,230,138,0.12)'},
  {id:'allocation',name:'Allocations / Aides',icon:'fa-hand-holding-usd',color:'#ffb347',bg:'rgba(255,179,71,0.12)'},
  {id:'reimbursement',name:'Remboursements',icon:'fa-receipt',color:'#c084fc',bg:'rgba(192,132,252,0.12)'},
  {id:'investment',name:'Investissements',icon:'fa-chart-line',color:'#38bdf8',bg:'rgba(56,189,248,0.12)'},
  {id:'gift',name:'Cadeaux / Ventes',icon:'fa-gift',color:'#fb7185',bg:'rgba(251,113,133,0.12)'},
  {id:'rent_inc',name:'Revenus locatifs',icon:'fa-building',color:'#ff5c5c',bg:'rgba(255,92,92,0.12)'},
  {id:'other_inc',name:'Autre revenu',icon:'fa-ellipsis-h',color:'#94a3b8',bg:'rgba(148,163,184,0.12)'}
];
const ACC_ICONS=['fa-university','fa-piggy-bank','fa-credit-card','fa-money-bill-wave','fa-wallet','fa-coins','fa-paypal','fa-google-wallet'];
const ACC_COLORS=['#5cb8ff','#00e68a','#ffb347','#c084fc','#fb7185','#38bdf8','#ff5c5c','#94a3b8'];

// ═══════════════════════════════════
// ÉTAT
// ═══════════════════════════════════
function load(){try{const d=JSON.parse(localStorage.getItem('fintrack_v3'));if(d&&d.expenses&&d.incomes&&d.goals&&d.accounts&&d.budgets)return d;}catch(e){}return{expenses:[],incomes:[],goals:[],accounts:[],budgets:{}};}
function save(){localStorage.setItem('fintrack_v3',JSON.stringify(S));}
let S=load();let curPage='dashboard';let CH={};

// ═══════════════════════════════════
// UTILITAIRES
// ═══════════════════════════════════
const gid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fm=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2}).format(n);
const fd=d=>new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
const gec=id=>EXP_CATS.find(c=>c.id===id)||EXP_CATS[7];
const gic=id=>INC_CATS.find(c=>c.id===id)||INC_CATS[7];
const gac=id=>S.accounts.find(a=>a.id===id);
const tExp=()=>S.expenses.reduce((s,e)=>s+e.amount,0);
const tInc=()=>S.incomes.reduce((s,e)=>s+e.amount,0);
const netBal=()=>tInc()-tExp();
function expInMonth(y,m){return S.expenses.filter(e=>{const d=new Date(e.date);return d.getMonth()===m&&d.getFullYear()===y;}).reduce((s,e)=>s+e.amount,0);}
function incInMonth(y,m){return S.incomes.filter(e=>{const d=new Date(e.date);return d.getMonth()===m&&d.getFullYear()===y;}).reduce((s,e)=>s+e.amount,0);}
function expInMonthByCat(y,m,cat){return S.expenses.filter(e=>{const d=new Date(e.date);return d.getMonth()===m&&d.getFullYear()===y&&e.category===cat;}).reduce((s,e)=>s+e.amount,0);}
function accountBal(aid){const a=S.accounts.find(x=>x.id===aid);if(!a)return 0;return(a.initialBalance||0)+S.incomes.filter(e=>e.accountId===aid).reduce((s,e)=>s+e.amount,0)-S.expenses.filter(e=>e.accountId===aid).reduce((s,e)=>s+e.amount,0);}
function toast(msg,type='ok'){const c=document.getElementById('toast-c'),t=document.createElement('div');t.className=`toast ${type}`;const ic={ok:'fa-check-circle',err:'fa-exclamation-circle',inf:'fa-info-circle',wrn:'fa-exclamation-triangle'};t.innerHTML=`<i class="fas ${ic[type]||ic.ok}"></i> ${msg}`;c.appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300);},3200);}
function openM(c){document.getElementById('modal-root').innerHTML=`<div class="mo" onclick="if(event.target===this)closeM()"><div class="mo-b">${c}</div></div>`;}
function closeM(){document.getElementById('modal-root').innerHTML='';}

// ═══════════════════════════════════
// ALERTES
// ═══════════════════════════════════
function computeAlerts(){
  const alerts=[];const now=new Date(),cm=now.getMonth(),cy=now.getFullYear();
  if(netBal()<0)alerts.push({type:'danger',icon:'fa-balance-scale',msg:`Solde net négatif : ${fm(netBal())}`,priority:3});

function renderGoals(){const pg=document.getElementById('page-goals');const act=S.goals.filter(g=>g.current<g.target),done=S.goals.filter(g=>g.current>=g.target);pg.innerHTML=`<div class="anim-fade-up"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;"><div><h2 style="font-size:28px;font-weight:700;">Objectifs</h2><p style="color:var(--fg-muted);font-size:14px;margin-top:4px;">${act.length} en cours — ${done.length} atteint(s)</p></div><button class="btn-p" onclick="openGoalM()"><i class="fas fa-plus" style="margin-right:6px;"></i> Nouvel objectif</button></div>${act.length===0&&done.length===0?`<div class="card" style="padding:60px 20px;text-align:center;"><i class="fas fa-bullseye" style="font-size:48px;color:var(--border-light);margin-bottom:16px;"></i><p style="color:var(--fg-muted);font-size:15px;">Aucun objectif</p><button class="btn-p" style="margin-top:16px;" onclick="openGoalM()">Créer</button></div>`:''}${act.length>0?`<h3 style="font-size:16px;font-weight:600;margin-bottom:14px;color:var(--fg-muted);">En cours</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:28px;">${act.map(g=>goalCard(g,false)).join('')}</div>`:''}${done.length>0?`<h3 style="font-size:16px;font-weight:600;margin-bottom:14px;color:var(--fg-muted);">Atteints</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:28px;">${done.map(g=>goalCard(g,true)).join('')}</div>`:''}</div>`;}
function goalCard(g,d){const pct=Math.min((g.current/g.target*100),100),rem=Math.max(g.target-g.current,0);const dl=g.deadline?Math.ceil((new Date(g.deadline)-new Date())/86400000):null;const od=dl!==null&&dl<0&&!d;return`<div class="card" style="padding:22px;${d?'border-color:rgba(0,230,138,0.2);':''}position:relative;overflow:hidden;">${d?'<div style="position:absolute;top:12px;right:12px;background:rgba(0,230,138,0.15);color:var(--accent);padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;"><i class="fas fa-check"></i> Atteint</div>':''}<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;"><div style="width:40px;height:40px;background:${d?'rgba(0,230,138,0.15)':'var(--bg)'};border-radius:12px;display:flex;align-items:center;justify-content:center;"><i class="fas ${g.icon||'fa-bullseye'}" style="color:${d?'var(--accent)':'var(--fg-muted)'};font-size:16px;"></i></div><div><div style="font-size:16px;font-weight:600;">${g.name}</div>${g.deadline?`<div style="font-size:12px;color:${od?'var(--danger)':'var(--fg-muted)'};">${od?'Échéance dépassée':dl+'j restant(s)'}</div>`:''}</div></div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;"><span style="font-weight:600;color:var(--accent);">${fm(g.current)}</span><span style="color:var(--fg-muted);">sur ${fm(g.target)}</span></div><div class="prog-t" style="margin-bottom:12px;"><div class="prog-f" style="width:${pct}%;background:${d?'var(--accent)':'linear-gradient(90deg,var(--accent-dim),var(--accent))'};"></div></div><div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--fg-muted);margin-bottom:14px;"><span>${pct.toFixed(1)}%</span><span>Reste ${fm(rem)}</span></div><div style="display:flex;gap:8px;">${!d?`<button class="btn-p" style="padding:7px 14px;font-size:12px;flex:1;" onclick="openContribM('${g.id}')"><i class="fas fa-plus" style="margin-right:4px;"></i> Contribuer</button>`:''}<button class="btn-s" style="padding:7px 14px;font-size:12px;" onclick="openGoalM('${g.id}')"><i class="fas fa-pen" style="font-size:11px;"></i></button><button class="btn-d" style="padding:7px 12px;" onclick="delGoal('${g.id}')"><i class="fas fa-trash" style="font-size:11px;"></i></button></div></div>`;}
function openGoalM(eid){const e=eid?S.goals.find(g=>g.id===eid):null;const t=e?"Modifier l'objectif":'Nouvel objectif';const icons=['fa-bullseye','fa-plane','fa-home','fa-car','fa-graduation-cap','fa-heart','fa-gift','fa-laptop','fa-plane-departure','fa-umbrella-beach'];openM(`<h3 style="font-size:18px;font-weight:700;margin-bottom:20px;">${t}</h3><div style="display:flex;flex-direction:column;gap:14px;"><div><label style="font-size:13px;color:var(--fg-muted);display:block;margin-bottom:6px;">Nom</label><input type="text" id="g-name" class="inp" value="${e?.name||''}" placeholder="Ex : Vacances" maxlength="50"></div><div><label style="font-size:13px;color:var(--fg-muted);display:block;margin-bottom:6px;">Montant cible (€)</label><input type="number" id="g-target" class="inp" value="${e?.target||''}" placeholder="3000" min="1" step="0.01"></div>${!e?`<div><label style="font-size:13px;color:var(--fg-muted);display:block;margin-bottom:6px;">Montant initial (€)</label><input type="number" id="g-cur" class="inp" value="0" min="0" step="0.01"></div>`:''}<div><label style="font-size:13px;color:var(--fg-muted);display:block;margin-bottom:6px;">Date cible</label><input type="date" id="g-dl" class="inp" value="${e?.deadline||''}"></div><div><label style="font-size:13px;color:var(--fg-muted);display:block;margin-bottom:8px;">Icône</label><div style="display:flex;gap:8px;flex-wrap:wrap;">${icons.map(ic=>`<div onclick="document.querySelectorAll('.ipk').forEach(x=>x.style.borderColor='var(--border)');this.style.borderColor='var(--accent)';document.getElementById('g-icon-v').value='${ic}';" class="ipk" style="width:36px;height:36px;background:var(--bg);border:2px solid ${e?.icon===ic?'var(--accent)':'var(--border)'};border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;" onmouseover="this.style.background='var(--accent-glow)'" onmouseout="this.style.background='var(--bg)'"><i class="fas ${ic}" style="color:var(--fg-muted);font-size:13px;"></i></div>`).join('')}</div><input type="hidden" id="g-icon-v" value="${e?.icon||'fa-bullseye'}"></div></div><div style="display:flex;gap:10px;margin-top:22px;justify-content:flex-end;"><button class="btn-s" onclick="closeM()">Annuler</button><button class="btn-p" onclick="saveGoal('${eid||''}')">${e?'Modifier':'Créer'}</button></div>`);}
function saveGoal(eid){const name=document.getElementById('g-name').value.trim(),target=parseFloat(document.getElementById('g-target').value),deadline=document.getElementById('g-dl').value||null,icon=document.getElementById('g-icon-v').value||'fa-bullseye';if(!name){toast('Nom requis','err');return;}if(isNaN(target)||target<=0){toast('Montant invalide','err');return;}if(eid){const i=S.goals.findIndex(g=>g.id===eid);if(i>=0){S.goals[i]={...S.goals[i],name,target,deadline,icon};toast('Objectif modifié');}}else{const cur=parseFloat(document.getElementById('g-cur')?.value||0);S.goals.push({id:gid(),name,target,current:Math.max(0,cur||0),deadline,icon});toast('Objectif créé');}save();closeM();renderGoals();updateAlertBell();}
function openContribM(gid2){const g=S.goals.find(x=>x.id===gid2);if(!g)return;const rem=g.target-g.current;openM(`<h3 style="font-size:18px;font-weight:700;margin-bottom:6px;">Contribuer à "${g.name}"</h3><p style="color:var(--fg-muted);font-size:13px;margin-bottom:18px;">Reste ${fm(rem)}</p><label style="font-size:13px;color:var(--fg-muted);display:block;margin-bottom:6px;">Montant (€)</label><input type="number" id="contrib-amt" class="inp" placeholder="0.00" min="0.01" max="${rem}" step="0.01"><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">${[10,50,100,500].map(v=>v<=rem?`<button class="btn-s" style="padding:6px 12px;font-size:12px;" onclick="document.getElementById('contrib-amt').value=${v}">${v} €</button>`:'').join('')}<button class="btn-s" style="padding:6px 12px;font-size:12px;" onclick="document.getElementById('contrib-amt').value=${rem.toFixed(2)}">Tout</button></div><div style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end;"><button class="btn-s" onclick="closeM()">Annuler</button><button class="btn-p" onclick="saveContrib('${gid2}')">Contribuer</button></div>`);setTimeout(()=>document.getElementById('contrib-amt')?.focus(),100);}
function saveContrib(gid2){const amt=parseFloat(document.getElementById('contrib-amt').value);if(isNaN(amt)||amt<=0){toast('Montant invalide','err');return;}const g=S.goals.find(x=>x.id===gid2);if(!g)return;g.current=Math.min(g.current+amt,g.target);save();closeM();if(g.current>=g.target)toast(`Objectif "${g.name}" atteint !`);else toast(`${fm(amt)} ajouté(s)`);renderGoals();updateAlertBell();}
function delGoal(id){openM(`<h3 style="font-size:18px;font-weight:700;margin-bottom:12px;">Supprimer cet objectif ?</h3><p style="color:var(--fg-muted);font-size:14px;margin-bottom:20px;">Cette action est irréversible.</p><div style="display:flex;gap:10px;justify-content:flex-end;"><button class="btn-s" onclick="closeM()">Annuler</button><button class="btn-d" style="padding:10px 20px;font-size:14px;" onclick="S.goals=S.goals.filter(g=>g.id!=='${id}');save();closeM();toast('Objectif supprimé','inf');renderGoals();updateAlertBell();">Supprimer</button></div>`);}

function renderAcc(){const pg=document.getElementById('page-accounts');pg.innerHTML=`<div class="anim-fade-up"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;"><div><h2 style="font-size:28px;font-weight:700;">Comptes</h2><p style="color:var(--fg-muted);font-size:14px;margin-top:4px;">${S.accounts.length} compte(s) — Total : <span style="color:var(--accent);font-weight:600;">${fm(S.accounts.reduce((s,a)=>s+accountBal(a.id),0))}</span></p></div><button class="btn-p" onclick="openAccM()"><i class="fas fa-plus" style="margin-right:6px;"></i> Nouveau</button></div>${S.accounts.length===0?`<div class="card" style="padding:60px 20px;text-align:center;"><i class="fas fa-wallet" style="font-size:48px;color:var(--border-light);margin-bottom:16px;"></i><p style="color:var(--fg-muted);font-size:15px;">Aucun compte</p><button class="btn-p" style="margin-top:16px;" onclick="openAccM()">Créer</button></div>`:S.accounts.map(a=>{const bal=accountBal(a.id);const inc=S.incomes.filter(e=>e.accountId===a.id).reduce((s,e)=>s+e.amount,0);const exp=S.expenses.filter(e=>e.accountId===a.id).reduce((s,e)=>s+e.amount,0);const nbTx=S.incomes.filter(e=>e.accountId===a.id).length+S.expenses.filter(e=>e.accountId===a.id).length;return`<div class="card" style="padding:22px;margin-bottom:16px;"><div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;"><div style="width:48px;height:48px;background:${a.color||'var(--accent)'}22;border-radius:14px;display:flex;align-items:center;justify-content:center;"><i class="fas ${a.icon||'fa-wallet'}" style="color:${a.color||'var(--accent)'};font-size:20px;"></i></div><div style="flex:1;"><div style="font-size:18px;font-weight:600;">${a.name}</div><div style="font-size:12px;color:var(--fg-muted);">${nbTx} transaction(s)</div></div><div style="text-align:right;"><div style="font-size:24px;font-weight:700;color:${bal>=0?'var(--fg)':'var(--danger)'};">${fm(bal)}</div><div style="font-size:11px;color:var(--fg-muted);">Solde</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;"><div style="background:var(--bg);border-radius:10px;padding:12px;text-align:center;"><div style="font-size:10px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:1px;">Initial</div><div style="font-size:15px;font-weight:600;margin-top:4px;">${fm(a.initialBalance||0)}</div></div><div style="background:var(--bg);border-radius:10px;padding:12px;text-align:center;"><div style="font-size:10px;color:var(--income);text-transform:uppercase;letter-spacing:1px;">Revenus</div><div style="font-size:15px;font-weight:600;margin-top:4px;color:var(--income);">+${fm(inc)}</div></div><div style="background:var(--bg);border-radius:10px;padding:12px;text-align:center;"><div style="font-size:10px;color:var(--danger);text-transform:uppercase;letter-spacing:1px;">Dépenses</div><div style="font-size:15px;font-weight:600;margin-top:4px;color:var(--danger);">-${fm(exp)}</div></div></div><div style="display:flex;gap:8px;justify-content:flex-end;"><button class="btn-s" style="padding:7px 14px;font-size:12px;" onclick="openAccM('${a.id}')"><i class="fas fa-pen" style="font-size:11px;margin-right:4px;"></i> Modifier</button><button class="btn-d" onclick="delAcc('${a.id}')"><i class="fas fa-trash" style="font-size:11px;margin-right:4px;"></i> Supprimer</button></div></div>`;}).join('')}</div>`;}
function openAccM(eid){const e=eid?S.accounts.find(a=>a.id===eid):null;const t=e?'Modifier le compte':'Nouveau compte';openM(`<h3 style="font-size:18px;font-weight:700;margin-bottom:20px;">${t}</h3><div style="display:flex;flex-direction:column;gap:14px;"><div><label style="font-size:13px;color:var(--fg-muted);display:block;margin-bottom:6px;">Nom</label><input type="text" id="acc-name" class="inp" value="${e?.name||''}" placeholder="Ex : Compte courant" maxlength="40"></div><div><label style="font-size:13px;color:var(--fg-muted);display:block;margin-bottom:6px;">Solde initial (€)</label><input type="number" id="acc-bal" class="inp" value="${e?.initialBalance||0}" step="0.01"></div><div><label style="font-size:13px;color:var(--fg-muted);display:block;margin-bottom:8px;">Icône</label><div style="display:flex;gap:8px;flex-wrap:wrap;">${ACC_ICONS.map((ic,i)=>`<div onclick="document.querySelectorAll('.aipk').forEach(x=>x.style.borderColor='var(--border)');this.style.borderColor='var(--accent)';document.getElementById('acc-icon-v').value='${ic}';document.getElementById('acc-color-v').value='${ACC_COLORS[i]}';" class="aipk" style="width:36px;height:36px;background:var(--bg);border:2px solid ${e?.icon===ic?'var(--accent)':'var(--border)'};border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;" onmouseover="this.style.background='var(--accent-glow)'" onmouseout="this.style.background='var(--bg)'"><i class="fas ${ic}" style="color:${ACC_COLORS[i]};font-size:13px;"></i></div>`).join('')}</div><input type="hidden" id="acc-icon-v" value="${e?.icon||'fa-university'}"><input type="hidden" id="acc-color-v" value="${e?.color||'#5cb8ff'}"></div></div><div style="display:flex;gap:10px;margin-top:22px;justify-content:flex-end;"><button class="btn-s" onclick="closeM()">Annuler</button><button class="btn-p" onclick="saveAcc('${eid||''}')">${e?'Modifier':'Créer'}</button></div>`);setTimeout(()=>document.getElementById('acc-name')?.focus(),100);}
function saveAcc(eid){const name=document.getElementById('acc-name').value.trim(),initBal=parseFloat(document.getElementById('acc-bal').value)||0,icon=document.getElementById('acc-icon-v').value||'fa-university',color=document.getElementById('acc-color-v').value||'#5cb8ff';if(!name){toast('Nom requis','err');return;}if(eid){const i=S.accounts.findIndex(a=>a.id===eid);if(i>=0){S.accounts[i]={...S.accounts[i],name,initialBalance:initBal,icon,color};toast('Compte modifié');}}else{S.accounts.push({id:gid(),name,initialBalance:initBal,icon,color});toast('Compte créé');}save();closeM();renderAcc();updateSBal();updateAlertBell();}
function delAcc(id){const nbTx=S.incomes.filter(e=>e.accountId===id).length+S.expenses.filter(e=>e.accountId===id).length;openM(`<h3 style="font-size:18px;font-weight:700;margin-bottom:12px;">Supprimer ce compte ?</h3>${nbTx>0?`<p style="color:var(--warning);font-size:13px;margin-bottom:8px;"><i class="fas fa-exclamation-triangle" style="margin-right:4px;"></i> ${nbTx} transaction(s) seront détachées.</p>`:''}<p style="color:var(--fg-muted);font-size:14px;margin-bottom:20px;">Cette action est irréversible.</p><div style="display:flex;gap:10px;justify-content:flex-end;"><button class="btn-s" onclick="closeM()">Annuler</button><button class="btn-d" style="padding:10px 20px;font-size:14px;" onclick="S.incomes.forEach(e=>{if(e.accountId==='${id}')e.accountId='';});S.expenses.forEach(e=>{if(e.accountId==='${id}')e.accountId='';});S.accounts=S.accounts.filter(a=>a.id!=='${id}');save();closeM();toast('Compte supprimé','inf');renderAcc();updateSBal();updateAlertBell();">Supprimer</button></div>`);}

function renderBud(){const pg=document.getElementById('page-budgets');const now=new Date(),cm=now.getMonth(),cy=now.getFullYear();pg.innerHTML=`<div class="anim-fade-up"><div style="margin-bottom:24px;"><h2 style="font-size:28px;font-weight:700;">Budgets mensuels</h2><p style="color:var(--fg-muted);font-size:14px;margin-top:4px;">Plafond par catégorie de dépense</p></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;">${EXP_CATS.map(cat=>{const budget=S.budgets[cat.id]||0;const spent=expInMonthByCat(cy,cm,cat.id);const pct=budget>0?Math.min(spent/budget*100,100):0;const over=budget>0&&spent>budget;const near=budget>0&&pct>=80&&!over;return`<div class="card" style="padding:22px;${over?'border-color:rgba(255,92,92,0.3);':near?'border-color:rgba(255,179,71,0.2);':''}"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;"><div style="width:44px;height:44px;background:${cat.bg};border-radius:12px;display:flex;align-items:center;justify-content:center;"><i class="fas ${cat.icon}" style="color:${cat.color};font-size:18px;"></i></div><div style="flex:1;"><div style="font-size:16px;font-weight:600;">${cat.name}</div><div style="font-size:12px;color:var(--fg-muted);">Ce mois : ${fm(spent)}</div></div>${over?'<i class="fas fa-exclamation-circle" style="color:var(--danger);font-size:20px;"></i>':near?'<i class="fas fa-exclamation-triangle" style="color:var(--warning);font-size:18px;"></i>':''}</div>${budget>0?`<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;"><span style="font-weight:600;color:${over?'var(--danger)':'var(--fg)'};">${fm(spent)}</span><span style="color:var(--fg-muted);">/ ${fm(budget)}</span></div><div class="prog-t" style="margin-bottom:10px;"><div class="prog-f" style="width:${pct}%;background:${over?'var(--danger)':near?'var(--warning)':cat.color};"></div></div><div style="display:flex;justify-content:space-between;font-size:12px;"><span style="color:${over?'var(--danger)':'var(--fg-muted)'};font-weight:${over?'600':'400'};">${over?'Dépassé de '+fm(spent-budget):pct.toFixed(0)+'%'}</span><span style="color:var(--fg-muted);">Reste ${fm(Math.max(budget-spent,0))}</span></div>`:`<div style="padding:12px;background:var(--bg);border-radius:10px;text-align:center;color:var(--fg-muted);font-size:13px;">Aucun budget défini</div>`}<div style="margin-top:14px;display:flex;gap:8px;"><button class="btn-s" style="padding:7px 14px;font-size:12px;flex:1;" onclick="openBudSetM('${cat.id}')"><i class="fas fa-sliders-h" style="font-size:11px;margin-right:4px;"></i> ${budget>0?'Modifier':'Définir'}</button>${budget>0?`<button class="btn-d" onclick="S.budgets['${cat.id}']=0;save();renderBud();updateAlertBell();toast('Budget retiré','inf');">Retirer</button>`:''}</div></div>`;}).join('')}</div></div>`;}
function openBudSetM(catId){const cat=gec(catId);const cur=S.budgets[catId]||0;openM(`<h3 style="font-size:18px;font-weight:700;margin-bottom:6px;">Budget "${cat.name}"</h3><p style="color:var(--fg-muted);font-size:13px;margin-bottom:18px;">Plafond mensuel</p><label style="font-size:13px;color:var(--fg-muted);display:block;margin-bottom:6px;">Montant (€/mois)</label><input type="number" id="bud-amt" class="inp" value="${cur||''}" placeholder="300" min="0" step="1"><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">${[50,100,200,300,500].map(v=>`<button class="btn-s" style="padding:6px 12px;font-size:12px;" onclick="document.getElementById('bud-amt').value=${v}">${v} €</button>`).join('')}</div><div style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end;"><button class="btn-s" onclick="closeM()">Annuler</button><button class="btn-p" onclick="saveBudSet('${catId}')">Enregistrer</button></div>`);setTimeout(()=>document.getElementById('bud-amt')?.focus(),100);}
function saveBudSet(catId){const amt=parseFloat(document.getElementById('bud-amt').value);if(isNaN(amt)||amt<0){toast('Montant invalide','err');return;}S.budgets[catId]=amt;save();closeM();toast('Budget enregistré');renderBud();updateAlertBell();}

function renderStats(){const pg=document.getElementById('page-stats');const tE=tExp(),tI=tInc(),sr=tI>0?((tI-tE)/tI*100):0;const catET={},catIT={};S.expenses.forEach(e=>{catET[e.category]=(catET[e.category]||0)+e.amount;});S.incomes.forEach(e=>{catIT[e.category]=(catIT[e.category]||0)+e.amount;});const eE=Object.entries(catET).sort((a,b)=>b[1]-a[1]),eI=Object.entries(catIT).sort((a,b)=>b[1]-a[1]);const ml=[],now=new Date();for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ml.push({key:d.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'}),y:d.getFullYear(),m:d.getMonth()});}const iD=ml.map(x=>incInMonth(x.y,x.m)),eD=ml.map(x=>expInMonth(x.y,x.m));const iv=iD.filter(v=>v>0),ev=eD.filter(v=>v>0);const avgI=iv.length>0?iv.reduce((a,b)=>a+b,0)/iv.length:0;const avgE=ev.length>0?ev.reduce((a,b)=>a+b,0)/ev.length:0;pg.innerHTML=`<div class="anim-fade-up"><h2 style="font-size:28px;font-weight:700;margin-bottom:6px;">Statistiques</h2><p style="color:var(--fg-muted);font-size:14px;margin-bottom:24px;">Analyse détaillée</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;"><div class="card" style="padding:18px;text-align:center;"><div style="font-size:11px;color:var(--fg-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px;">Total revenus</div><div style="font-size:22px;font-weight:700;margin-top:6px;color:var(--income);">${fm(tI)}</div></div><div class="card" style="padding:18px;text-align:center;"><div style="font-size:11px;color:var(--fg-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px;">Total dépensé</div><div style="font-size:22px;font-weight:700;margin-top:6px;color:var(--danger);">${fm(tE)}</div></div><div class="card" style="padding:18px;text-align:center;"><div style="font-size:11px;color:var(--fg-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px;">Taux d'épargne</div><div style="font-size:22px;font-weight:700;margin-top:6px;
