<style>
:root{--bg:#0a0f0d;--bg-card:#111a16;--bg-card-alt:#162019;--fg:#e8f0ec;--fg-muted:#7a9488;--accent:#00e68a;--accent-dim:#00b36b;--accent-glow:rgba(0,230,138,0.15);--income:#5cb8ff;--income-dim:#3a9cdf;--income-glow:rgba(92,184,255,0.15);--danger:#ff5c5c;--danger-dim:rgba(255,92,92,0.15);--warning:#ffb347;--warning-dim:rgba(255,179,71,0.15);--border:#1e2e27;--border-light:#2a3d33}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif}
.bg-atmo{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 600px 400px at 10% 20%,rgba(0,230,138,0.06),transparent),radial-gradient(ellipse 500px 500px at 85% 70%,rgba(92,184,255,0.04),transparent)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-15px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 15px var(--accent-glow)}50%{box-shadow:0 0 30px var(--accent-glow),0 0 60px rgba(0,230,138,0.05)}}
@keyframes progressFill{from{width:0}}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(0.9)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes bellShake{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-8deg)}45%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}75%{transform:rotate(2deg)}}
.anim-fade-up{animation:fadeUp .5s ease both}.anim-slide-in{animation:slideIn .4s ease both}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;transition:border-color .3s,box-shadow .3s}
.card:hover{border-color:var(--border-light);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.btn-p{background:var(--accent);color:var(--bg);font-weight:600;border-radius:12px;padding:10px 20px;border:none;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;font-size:14px}
.btn-p:hover{background:var(--accent-dim);transform:translateY(-1px);box-shadow:0 4px 20px var(--accent-glow)}
.btn-i{background:var(--income);color:var(--bg);font-weight:600;border-radius:12px;padding:10px 20px;border:none;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;font-size:14px}
.btn-i:hover{background:var(--income-dim);transform:translateY(-1px);box-shadow:0 4px 20px var(--income-glow)}
.btn-s{background:transparent;color:var(--fg);font-weight:500;border-radius:12px;padding:10px 20px;border:1px solid var(--border-light);cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;font-size:14px}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.btn-d{background:var(--danger-dim);color:var(--danger);font-weight:500;border-radius:10px;padding:6px 12px;border:none;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;font-size:13px}
.btn-d:hover{background:rgba(255,92,92,0.25)}
.inp{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--fg);font-family:'DM Sans',sans-serif;font-size:14px;width:100%;transition:border-color .2s,box-shadow .2s;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.inp::placeholder{color:var(--fg-muted)}
select.inp{appearance:none;cursor:pointer}
.nav-i{padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;color:var(--fg-muted);font-weight:500;display:flex;align-items:center;gap:10px;font-size:14px}
.nav-i:hover{color:var(--fg);background:var(--bg-card-alt)}
.nav-i.active{color:var(--accent);background:var(--accent-glow);animation:pulseGlow 3s ease infinite}
.prog-t{background:var(--border);border-radius:8px;height:10px;overflow:hidden}
.prog-f{height:100%;border-radius:8px;animation:progressFill .8s ease both;transition:width .5s ease}
.toast-c{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;animation:toastIn .3s ease both;display:flex;align-items:center;gap:8px;min-width:250px;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
.toast.out{animation:toastOut .3s ease both}
.toast.ok{background:#0d2b1a;color:var(--accent);border:1px solid rgba(0,230,138,0.2)}
.toast.err{background:#2b0d0d;color:var(--danger);border:1px solid rgba(255,92,92,0.2)}
.toast.inf{background:#0d1f2b;color:#5cb8ff;border:1px solid rgba(92,184,255,0.2)}
.toast.wrn{background:#2b1f0d;color:var(--warning);border:1px solid rgba(255,179,71,0.2)}
.mo{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;animation:fadeUp .25s ease both}
.mo-b{background:var(--bg-card);border:1px solid var(--border-light);border-radius:20px;padding:28px;max-width:520px;width:90%;animation:fadeUp .3s ease both;max-height:85vh;overflow-y:auto}
.cat-b{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600}
.sc::before{content:'';position:absolute;inset:0;border-radius:16px;background:linear-gradient(90deg,transparent 30%,rgba(0,230,138,0.03) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 4s ease infinite;pointer-events:none}
.bell-shake{animation:bellShake .8s ease}
.install-btn{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:900;background:var(--accent);color:var(--bg);font-weight:700;border-radius:16px;padding:14px 28px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:15px;box-shadow:0 8px 30px rgba(0,230,138,0.3);display:none;animation:fadeUp .4s ease both;transition:transform .2s,box-shadow .2s}
.install-btn:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 12px 40px rgba(0,230,138,0.4)}

/* Grilles responsives */
.gr2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.gr4{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.gr-s{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gr-m{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.gr-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

@media(max-width:768px){
  .sb{display:none!important}
  .mc{margin-left:0!important;padding:16px!important}
  .mn{display:flex!important}
  .install-btn{bottom:90px}
  .gr2{grid-template-columns:1fr!important}
  .gr4{grid-template-columns:1fr!important}
  .gr-s{grid-template-columns:1fr 1fr!important;gap:10px!important}
  .gr-m{grid-template-columns:1fr!important}
  .gr-l{grid-template-columns:1fr!important}
  .card{border-radius:12px}
  h2{font-size:22px!important}
  .toast{min-width:0;font-size:13px}
  .mo-b{padding:20px;border-radius:16px}
}
@media(min-width:769px){.mn{display:none!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.pg-wrap{position:fixed;inset:0;z-index:2000;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;}
.pg-box{width:100%;max-width:420px;}
.pg-chip{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:all .2s;margin-bottom:10px;}
.pg-chip:hover{border-color:var(--accent);transform:translateY(-1px);}
.pg-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;}
.sb-prof{padding:10px 12px;background:var(--bg);border-radius:12px;border:1px solid var(--border);margin-top:10px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color .2s;}
.sb-prof:hover{border-color:var(--accent);}
.mob-prof{display:none;position:fixed;top:14px;right:14px;z-index:150;width:36px;height:36px;font-size:14px;border:1px solid var(--border);cursor:pointer;}
@media(max-width:768px){.mob-prof{display:flex!important;}}
</style>
</head>
<body>
<div class="bg-atmo"></div>
<div id="toast-c" class="toast-c"></div>
<button id="install-btn" class="install-btn" onclick="installPWA()"><i class="fas fa-download" style="margin-right:8px;"></i>Installer FinTrack</button>

<div id="profile-gate" class="pg-wrap"></div>
<div id="mob-profile-av" class="pg-av mob-prof" style="background:var(--accent-glow);color:var(--accent);" onclick="openProfileSwitch()">?</div>

<div id="app-root" style="display:none;min-height:100vh;position:relative;z-index:1;">
<aside class="sb" style="width:240px;background:var(--bg-card);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding:0 8px;">
    <div style="display:flex;align-items:center;gap:10px;"><div style="width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-chart-line" style="color:var(--bg);font-size:16px;"></i></div><h1 style="font-size:20px;font-weight:700;">FinTrack</h1></div>
    <div id="alert-bell" onclick="toggleAlertPanel()" style="position:relative;cursor:pointer;padding:8px;border-radius:10px;transition:all .2s;" onmouseover="this.style.background='var(--bg-card-alt)'" onmouseout="this.style.background='transparent'"><i class="fas fa-bell" style="color:var(--fg-muted);font-size:16px;"></i><div id="alert-badge" style="display:none;position:absolute;top:4px;right:4px;min-width:16px;height:16px;background:var(--danger);border-radius:8px;font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg-card);"></div></div>
  </div>
  <div id="alert-panel" style="display:none;margin-bottom:16px;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:12px;max-height:240px;overflow-y:auto;"></div>
  <nav style="display:flex;flex-direction:column;gap:4px;flex:1;">
    <div class="nav-i active" data-page="dashboard" onclick="switchPage('dashboard')"><i class="fas fa-th-large"></i> Tableau de bord</div>
    <div class="nav-i" data-page="incomes" onclick="switchPage('incomes')"><i class="fas fa-arrow-up" style="color:var(--income);"></i> Revenus</div>
    <div class="nav-i" data-page="expenses" onclick="switchPage('expenses')"><i class="fas fa-arrow-down" style="color:var(--danger);"></i> Dépenses</div>
    <div class="nav-i" data-page="goals" onclick="switchPage('goals')"><i class="fas fa-bullseye"></i> Objectifs</div>
    <div class="nav-i" data-page="accounts" onclick="switchPage('accounts')"><i class="fas fa-wallet"></i> Comptes</div>
    <div class="nav-i" data-page="budgets" onclick="switchPage('budgets')"><i class="fas fa-sliders-h"></i> Budgets</div>
    <div class="nav-i" data-page="stats" onclick="switchPage('stats')"><i class="fas fa-chart-pie"></i> Statistiques</div>
  </nav>
  <div class="sb-prof" onclick="openProfileSwitch()"><div id="sb-profile-av" class="pg-av" style="width:34px;height:34px;font-size:13px;background:var(--accent-glow);color:var(--accent);">?</div><div style="flex:1;min-width:0;"><div id="sb-profile-name" style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Profil</div><div style="font-size:11px;color:var(--fg-muted);">Changer de profil</div></div><i class="fas fa-chevron-right" style="color:var(--fg-muted);font-size:11px;"></i></div>
  <div id="sb-bal" style="padding:12px;background:var(--bg);border-radius:12px;border:1px solid var(--border);margin-top:10px;"><div style="font-size:11px;color:var(--fg-muted);margin-bottom:4px;">Solde net</div><div id="sb-bal-v" style="font-size:18px;font-weight:700;color:var(--accent);">0 €</div></div>
</aside>
<main class="mc" style="flex:1;margin-left:240px;padding:24px;min-height:100vh;">
  <nav class="mn" style="display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);z-index:100;padding:8px 12px;justify-content:space-around;">
    <div onclick="switchPage('dashboard')" style="text-align:center;cursor:pointer;padding:4px;"><i class="fas fa-th-large" style="color:var(--accent);font-size:16px;"></i><div style="font-size:9px;color:var(--fg-muted);margin-top:2px;">Accueil</div></div>
    <div onclick="switchPage('incomes')" style="text-align:center;cursor:pointer;padding:4px;"><i class="fas fa-arrow-up" style="color:var(--income);font-size:16px;"></i><div style="font-size:9px;color:var(--fg-muted);margin-top:2px;">Revenus</div></div>
    <div onclick="switchPage('expenses')" style="text-align:center;cursor:pointer;padding:4px;"><i class="fas fa-arrow-down" style="color:var(--danger);font-size:16px;"></i><div style="font-size:9px;color:var(--fg-muted);margin-top:2px;">Dépenses</div></div>
    <div onclick="switchPage('goals')" style="text-align:center;cursor:pointer;padding:4px;"><i class="fas fa-bullseye" style="color:var(--fg-muted);font-size:16px;"></i><div style="font-size:9px;color:var(--fg-muted);margin-top:2px;">Objectifs</div></div>
    <div onclick="switchPage('accounts')" style="text-align:center;cursor:pointer;padding:4px;"><i class="fas fa-wallet" style="color:var(--fg-muted);font-size:16px;"></i><div style="font-size:9px;color:var(--fg-muted);margin-top:2px;">Comptes</div></div>
  </nav>
  <div id="page-dashboard"></div>
  <div id="page-incomes" style="display:none;"></div>
  <div id="page-expenses" style="display:none;"></div>
  <div id="page-goals" style="display:none;"></div>
  <div id="page-accounts" style="display:none;"></div>
  <div id="page-budgets" style="display:none;"></div>
  <div id="page-stats" style="display:none;"></div>
</main>
</div>
<div id="modal-root"></div>

<script>
// PWA
(function(){const m={name:'FinTrack — Suivi de Dépenses',short_name:'FinTrack',description:'Suivi de dépenses, revenus, objectifs et budgets',start_url:'./',display:'standalone',background_color:'#0a0f0d',theme_color:'#0a0f0d',orientation:'portrait-primary',icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="100" fill="%230a0f0d"/><path d="M150 340 L256 180 L362 340" stroke="%2300e68a" stroke-width="40" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="256" cy="180" r="24" fill="%2300e68a"/></svg>'),sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};const b=new Blob([JSON.stringify(m)],{type:'application/json'});const ml=document.getElementById('pwa-manifest');if(ml)ml.href=URL.createObjectURL(b);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));let dp=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;const btn=document.getElementById('install-btn');if(btn)btn.style.display='block';});window.installPWA=function(){if(!dp)return;dp.prompt();dp.userChoice.then(c=>{if(c.outcome==='accepted')toast('FinTrack installée !');dp=null;const btn=document.getElementById('install-btn');if(btn)btn.style.display='none';});};window.addEventListener('appinstalled',()=>{toast('Application installée');const btn=document.getElementById('install-btn');if(btn)btn.style.display='none';});})();
</script>

<script>
const EXP_CATS=[{id:'food',name:'Alimentation',icon:'fa-utensils',color:'#00e68a',bg:'rgba(0,230,138,0.12)'},{id:'transport',name:'Transport',icon:'fa-car',color:'#5cb8ff',bg:'rgba(92,184,255,0.12)'},{id:'housing',name:'Logement',icon:'fa-home',color:'#ffb347',bg:'rgba(255,179,71,0.12)'},{id:'health',name:'Santé',icon:'fa-heartbeat',color:'#ff5c5c',bg:'rgba(255,92,92,0.12)'},{id:'leisure',name:'Loisirs',icon:'fa-gamepad',color:'#c084fc',bg:'rgba(192,132,252,0.12)'},{id:'shopping',name:'Shopping',icon:'fa-shopping-bag',color:'#fb7185',bg:'rgba(251,113,133,0.12)'},{id:'education',name:'Éducation',icon:'fa-book',color:'#38bdf8',bg:'rgba(56,189,248,0.12)'},{id:'other_exp',name:'Autre',icon:'fa-ellipsis-h',color:'#94a3b8',bg:'rgba(148,163,184,0.12)'}];
const INC_CATS=[{id:'salary',name:'Salaire',icon:'fa-briefcase',color:'#5cb8ff',bg:'rgba(92,184,255,0.12)'},{id:'freelance',name:'Freelance/Livraison',icon:'fa-motorcycle',color:'#00e68a',bg:'rgba(0,230,138,0.12)'},{id:'allocation',name:'Allocations/Aides',icon:'fa-hand-holding-usd',color:'#ffb347',bg:'rgba(255,179,71,0.12)'},{id:'reimbursement',name:'Remboursements',icon:'fa-receipt',color:'#c084fc',bg:'rgba(192,132,252,0.12)'},{id:'investment',name:'Investissements',icon:'fa-chart-line',color:'#38bdf8',bg:'rgba(56,189,248,0.12)'},{id:'gift',name:'Cadeaux/Ventes',icon:'fa-gift',color:'#fb7185',bg:'rgba(251,113,133,0.12)'},{id:'rent_inc',name:'Revenus locatifs',icon:'fa-building',color:'#ff5c5c',bg:'rgba(255,92,92,0.12)'},{id:'other_inc',name:'Autre',icon:'fa-ellipsis-h',color:'#94a3b8',bg:'rgba(148,163,184,0.12)'}];
const AI=['fa-university','fa-piggy-bank','fa-credit-card','fa-money-bill-wave','fa-wallet','fa-coins','fa-paypal','fa-google-wallet'];
const AC=['#5cb8ff','#00e68a','#ffb347','#c084fc','#fb7185','#38bdf8','#ff5c5c','#94a3b8'];

function load(){try{const d=JSON.parse(localStorage.getItem('fintrack_v3_'+PID));if(d&&d.expenses&&d.incomes&&d.goals&&d.accounts&&d.budgets)return d;}catch(e){}return{expenses:[],incomes:[],goals:[],accounts:[],budgets:{}};}
function sv(){if(!PID)return;localStorage.setItem('fintrack_v3_'+PID,JSON.stringify(S));}
let S={expenses:[],incomes:[],goals:[],accounts:[],budgets:{}},curPage='dashboard',CH={};

// PROFILS (permet de séparer les données de plusieurs personnes sur le même appareil/navigateur)
const PROFILES_KEY='fintrack_profiles',ACTIVE_KEY='fintrack_active_profile';
const PAVA=['#00e68a','#5cb8ff','#ffb347','#c084fc','#fb7185','#38bdf8','#ff5c5c','#94a3b8'];
let PID=localStorage.getItem(ACTIVE_KEY)||null;
function loadProfiles(){try{const p=JSON.parse(localStorage.getItem(PROFILES_KEY));return Array.isArray(p)?p:[];}catch(e){return[];}}
function saveProfiles(p){localStorage.setItem(PROFILES_KEY,JSON.stringify(p));}
function pColor(id){let h=0;for(let i=0;i<id.length;i++)h=id.charCodeAt(i)+((h<<5)-h);return PAVA[Math.abs(h)%PAVA.length];}
function pInit(n){return(n||'?').trim().charAt(0).toUpperCase()||'?';}

function createProfile(){const inp=document.getElementById('new-p-name'),nm=inp.value.trim();if(!nm){toast('Nom requis','err');return;}const profiles=loadProfiles();if(profiles.some(p=>p.name.toLowerCase()===nm.toLowerCase())){toast('Ce nom est déjà pris sur cet appareil','err');return;}const isFirst=profiles.length===0;const id='p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);profiles.push({id,name:nm});saveProfiles(profiles);if(isFirst){try{const legacy=JSON.parse(localStorage.getItem('fintrack_v3'));if(legacy&&((legacy.expenses&&legacy.expenses.length)||(legacy.incomes&&legacy.incomes.length)||(legacy.goals&&legacy.goals.length)||(legacy.accounts&&legacy.accounts.length))){localStorage.setItem('fintrack_v3_'+id,JSON.stringify(legacy));}}catch(e){}}selectProfile(id);}

function cAl(){const a=[];const n=new Date(),cm=n.getMonth(),cy=n.getFullYear();if(nB()<0)a.push({type:'danger',icon:'fa-balance-scale',msg:`Solde négatif : ${fm(nB())}`,p:3});EXP_CATS.forEach(c=>{const b=S.budgets[c.id];if(!b||b<=0)return;const s=eIMC(cy,cm,c.id),p=s/b*100;if(p>=100)a.push({type:'danger',icon:c.icon,msg:`${c.name} : dépassé (${p.toFixed(0)}%)`,p:3});else if(p>=80)a.push({type:'warning',icon:c.icon,msg:`${c.name} : ${p.toFixed(0)}% du budget`,p:2});});S.goals.forEach(g=>{if(g.current>=g.target)return;if(g.deadline){const d=Math.ceil((new Date(g.deadline)-n)/86400000);if(d<0)a.push({type:'danger',icon:g.icon||'fa-bullseye',msg:`"${g.name}" : échéance dépassée`,p:3});else if(d<=7)a.push({type:'warning',icon:g.icon||'fa-bullseye',msg:`"${g.name}" : échéance ${d}j`,p:2});else if(d<=30)a.push({type:'info',icon:g.icon||'fa-bullseye',msg:`"${g.name}" : ${d}j restants`,p:1});}});S.accounts.forEach(a2=>{const b=aBal(a2.id);if(b<0)a.push({type:'danger',icon:a2.icon||'fa-wallet',msg:`${a2.name} : négatif (${fm(b)})`,p:3});});a.sort((a,b)=>b.p-a.p);return a;}
